name: CI

# PR과 main 푸시에서 검증을 자동 실행한다.
# main 직접 푸시는 브랜치 보호로 막혀 있으므로 push 트리거는 사실상 머지 시점에만 발화한다.
on:
  pull_request:
  push:
    branches: [main]

# 동일 브랜치에서 새 푸시가 일어나면 이전 실행을 취소해 자원을 절약한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치 (자체 캐시 활성화)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Python 3.13 설치
        run: uv python install 3.13

      - name: backend 의존성 동기화
        run: uv sync --project backend

      - name: backend 테스트 실행
        run: uv run --project backend pytest backend/tests/

  nat-test:
    name: finus_nat pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치 (자체 캐시 활성화)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Python 3.13 설치
        run: uv python install 3.13

      - name: finus_nat 의존성 동기화
        run: uv sync --project finus_nat

      - name: finus_nat 테스트 실행
        run: uv run --project finus_nat pytest finus_nat/tests/

      # 벤더 패치는 NAT·mem0 상류 소스와 바이트 단위로 맞물려 있다. 상류가 바뀌면
      # 패치가 조용히 안 붙는데, 위 pytest는 임시 디렉터리의 가짜 트리만 검증하므로
      # 이를 잡지 못한다. 이 스텝은 uv sync가 설치한 실제 패키지에 스크립트를 돌려
      # 의존성 갱신 PR 시점에 drift를 빨간불로 드러낸다.
      # Dockerfile보다 --require를 넓게 잡는다. 빌드는 memory.py만 있으면 되지만,
      # 나머지가 사라진 것도 여기서는 알아야 할 신호이기 때문이다.
      - name: 벤더 패치 적용 검증 (NAT 상류 drift 사전 감지)
        run: |
          uv run --project finus_nat python finus_nat/scripts/patch_vendor.py \
            --venv finus_nat/.venv \
            --require nat/plugins/mem0ai/memory.py \
            --require mem0/client/main.py \
            --require nat/plugins/mem0ai/mem0_editor.py \
            --require nat/plugins/langchain/agent/auto_memory_wrapper/agent.py

  mcp-trading-test:
    name: mcp-trading npm test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-trading
    steps:
      - uses: actions/checkout@v4

      - name: Node 24 설치 (npm 캐시 활성화)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mcp-trading/package-lock.json

      - name: npm 의존성 설치
        run: npm ci

      - name: mcp-trading 테스트 실행
        run: npm test

  frontend-typecheck:
    name: Frontend tsc --noEmit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4

      - name: Node 24 설치 (npm 캐시 활성화)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: npm 의존성 설치
        run: npm ci

      - name: 타입 체크
        run: npx tsc --noEmit

  docker-lint:
    name: Dockerfile hadolint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - backend/Dockerfile
          - finus_nat/Dockerfile
          - frontend-react/Dockerfile
          - mcp-news/Dockerfile
          - mcp-trading/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: hadolint 실행 - ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # Dockerfile 부채(#52)가 정리됐으므로 warning까지 차단해 신규 부채 유입을 막는다.
          failure-threshold: warning
