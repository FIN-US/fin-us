name: CI

# PR과 main 푸시에서 검증을 자동 실행한다.
# main 직접 푸시는 브랜치 보호로 막혀 있으므로 push 트리거는 사실상 머지 시점에만 발화한다.
on:
  pull_request:
  push:
    branches: [main]

# 동일 브랜치에서 새 푸시가 일어나면 이전 실행을 취소해 자원을 절약한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치 (자체 캐시 활성화)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Python 3.13 설치
        run: uv python install 3.13

      - name: backend 의존성 동기화
        run: uv sync --project backend

      - name: backend 테스트 실행
        run: uv run --project backend pytest backend/tests/

  nat-test:
    name: finus_nat pytest
    runs-on: ubuntu-latest
    # 아래 "벤더 패치 적용 검증" 스텝이 uv sync가 만든 실제 venv를 patch_vendor.py로 직접
    # 쓴다. uv 기본 link mode(hardlink)면 site-packages 파일이 ~/.cache/uv/archive-v0/...와
    # inode를 공유하고, 패치 스크립트가 그걸 truncate+rewrite하면서 enable-cache: true가
    # 저장한 캐시가 이미 패치된 상태로 오염된다. 그러면 다음 실행부터 uv sync가 오염된
    # 캐시를 하드링크해 오고, 스크립트는 already만 보고 exit 0으로 통과해 이 검증 스텝이
    # 아무것도 검증하지 못하게 된다. copy 모드로 강제해 캐시와 venv의 inode를 분리한다.
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치 (자체 캐시 활성화)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Python 3.13 설치
        run: uv python install 3.13

      - name: finus_nat 의존성 동기화
        run: uv sync --project finus_nat

      - name: finus_nat 테스트 실행
        run: uv run --project finus_nat pytest finus_nat/tests/

      # 벤더 패치는 NAT·mem0 상류 소스와 바이트 단위로 맞물려 있다. 상류가 바뀌면
      # 패치가 조용히 안 붙는데, 위 pytest는 임시 디렉터리의 가짜 트리만 검증하므로
      # 이를 잡지 못한다. 이 스텝은 uv sync가 설치한 실제 패키지에 스크립트를 돌려
      # 의존성 갱신 PR 시점에 drift를 빨간불로 드러낸다.
      # Dockerfile과 동일하게 네 대상 전부를 --require로 건다(scripts/patch_vendor.py
      # 상단 docstring 참고). 하나만 걸던 시절엔 여기가 Dockerfile보다 넓은 검증
      # 지점이었지만, Dockerfile도 네 개 전부를 강제하게 되면서 두 집합은 같아졌다.
      - name: 벤더 패치 적용 검증 (NAT 상류 drift 사전 감지)
        run: |
          uv run --project finus_nat python finus_nat/scripts/patch_vendor.py \
            --venv finus_nat/.venv \
            --require nat/plugins/mem0ai/memory.py \
            --require mem0/client/main.py \
            --require nat/plugins/mem0ai/mem0_editor.py \
            --require nat/plugins/langchain/agent/auto_memory_wrapper/agent.py

  mcp-trading-test:
    name: mcp-trading npm test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-trading
    steps:
      - uses: actions/checkout@v4

      - name: Node 24 설치 (npm 캐시 활성화)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mcp-trading/package-lock.json

      - name: npm 의존성 설치
        run: npm ci

      - name: mcp-trading 테스트 실행
        run: npm test

  mcp-dart-test:
    name: mcp-dart npm test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-dart
    steps:
      - uses: actions/checkout@v4

      - name: Node 24 설치 (npm 캐시 활성화)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mcp-dart/package-lock.json

      - name: npm 의존성 설치
        run: npm ci

      - name: mcp-dart 테스트 실행
        run: npm test

  # frontend/Assets(Unity 소스)를 고치고도 frontend/Build(WebGL 번들)를 재빌드하지 않으면
  # git이 추적하는 번들과 소스가 조용히 어긋난다(이슈 #212·PR #226에서 재빌드 절차를
  # frontend/README.md에 문서화했으나 강제 장치는 없었다). 이 잡은 그 강제 장치다.
  unity-build-drift:
    name: Unity 소스/번들 드리프트 검사
    # pull_request에서만 돈다. push(=머지 시점) 트리거는 체크아웃 대상이 머지 커밋이
    # 아니라 푸시된 커밋이라 아래 HEAD^1 기준이 다른 것을 가리킨다. 어차피 이 검사가
    # 보는 건 "이 PR이 Assets와 Build를 함께 건드렸는가"라 머지 후 다시 볼 이유도 없다.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request의 체크아웃 대상은 PR head가 아니라 머지 커밋(refs/pull/N/merge)이고,
          # 그 1번 부모가 곧 비교 기준(base)이다. depth 2면 이벤트 payload의 base.sha에
          # 의존하지 않고 체크아웃과 항상 자기일관적인 기준을 얻는다 — 재실행으로 payload는
          # 낡고 머지 ref만 재계산된 경우에도 둘이 어긋나지 않는다.
          # depth 1에서는 shallow graft가 부모를 가려 HEAD^1이 해석되지 않는다.
          # fetch-depth: 0(전체 이력)은 이 잡 하나를 위해 과하고, depth 2는 머지 커밋과
          # blob을 대부분 공유하는 델타만 받는다.
          fetch-depth: 2

      - name: Assets 변경 시 Build 동반 커밋 여부 확인
        # Actions의 `run:` 기본 셸은 `bash -e {0}`이라 pipefail이 꺼져 있다. 아래는 파이프를
        # 쓰지 않아 set -e가 git 실패를 직접 잡지만, 셸을 명시해 두면(-eo pipefail) 나중에
        # 파이프가 추가돼도 이 검사가 fail-open으로 무너지지 않는다.
        shell: bash
        run: |
          BASE=$(git rev-parse HEAD^1)
          # 감시 대상은 Scripts/가 아니라 Assets/ 전체다. frontend/README.md의 재빌드 규칙
          # 원문이 Assets/ 전체를 대상으로 하고, WebGLTemplates/·Scenes/·Resources/·
          # Plugins/WebGL/*.jslib 모두 WebGL 번들에 구워진다. .meta도 제외하지 않는다 —
          # 새 에셋 추가는 .meta 동반이면서 실제로 재빌드가 필요하다.
          SRC=$(git diff --name-only "$BASE" HEAD -- frontend/Assets/)
          BUILD=$(git diff --name-only "$BASE" HEAD -- frontend/Build/)
          if [ -n "$SRC" ] && [ -z "$BUILD" ]; then
            echo "::error::frontend/Assets/ 를 수정했으나 frontend/Build/ 가 갱신되지 않았습니다. Unity WebGL 재빌드 후 frontend/Build/를 함께 커밋하세요 (frontend/README.md의 재빌드 규칙 참고)."
            echo "변경된 소스 파일:"
            echo "$SRC" | sed 's/^/  /'
            exit 1
          fi

  docker-lint:
    name: Dockerfile hadolint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - backend/Dockerfile
          - finus_nat/Dockerfile
          - mcp-news/Dockerfile
          - mcp-trading/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: hadolint 실행 - ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # Dockerfile 부채(#52)가 정리됐으므로 warning까지 차단해 신규 부채 유입을 막는다.
          failure-threshold: warning

  # frontend/nginx.conf는 컨테이너가 뜰 때만 파싱되므로, 문법이 깨져도 PR 단계에서는
  # 아무 잡도 실패하지 않고 docker compose up에서야 드러난다. compose가 마운트하는
  # 것과 같은 경로에 걸어 nginx -t로 검증한다.
  nginx-config-check:
    name: nginx.conf 문법 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: nginx -t 실행
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t
