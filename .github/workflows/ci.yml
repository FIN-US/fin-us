name: CI

# PR과 main 푸시에서 검증을 자동 실행한다.
# main 직접 푸시는 브랜치 보호로 막혀 있으므로 push 트리거는 사실상 머지 시점에만 발화한다.
on:
  pull_request:
  push:
    branches: [main]

# 동일 브랜치에서 새 푸시가 일어나면 이전 실행을 취소해 자원을 절약한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend pytest
    runs-on: ubuntu-latest

    # backend/tests/test_redis_integration.py는 REDIS_INTEGRATION_URL이 없으면 전부
    # skip한다. 이 변수가 CI에 없던 동안 실 redis 커버리지는 0이었고, redis를 지나는
    # 코드는 전부 테스트 안 FakeRedis만 통과했다 — 즉 FakeRedis와 실제 redis-py의
    # 반환 규약(특히 set(..., nx=True, ex=...))이 어디에서도 대조되지 않았다(#267).
    # 락 획득 여부를 그 반환값으로 판정하므로, 어긋나면 테스트는 초록불인 채
    # 프로덕션 락만 깨진다. 서비스 컨테이너를 붙여 실제 서버와 대조한다.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        # 서비스가 뜨자마자 스텝이 시작되면 접속이 거부돼 테스트가 skip으로 새 나간다.
        # health check가 통과할 때까지 잡을 붙잡아 둔다.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: uv 설치 (자체 캐시 활성화)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Python 3.13 설치
        run: uv python install 3.13

      - name: backend 의존성 동기화
        run: uv sync --project backend

      - name: backend 테스트 실행
        # 서비스 컨테이너는 잡 컨테이너가 아닌 러너 호스트에 포트를 매핑하므로 localhost로 닿는다.
        env:
          REDIS_INTEGRATION_URL: redis://localhost:6379/0
        run: uv run --project backend pytest backend/tests/

  # #271이 state_store/pending_order_store의 주입 지점을 Any에서 Protocol로 좁혔지만,
  # Protocol은 정적 검사 장치인데 CI에는 체커가 없었다(#292). 이름과 인자 모양의 어긋남은
  # PR #287의 런타임 적합성 테스트가 잡지만, 이름·모양은 맞고 타입만 어긋나는 경우는
  # 아무 잡도 보지 못했다. 그 어긋남이 프로덕션에 들어가면 폴러의 _persist_state/
  # _restore_state에 있는 except Exception이 TypeError를 로그 한 줄로 흘려보내고
  # "영속화 없음"으로 degrade해, #248이 닫은 중복 실행 창이 조용히 다시 열린다.
  #
  # 대상·엄격도·제외 목록은 backend/pyproject.toml의 [tool.pyright]에 있다. 그 설정을
  # 그대로 읽으므로 로컬 에디터와 이 잡이 같은 것을 본다.
  backend-typecheck:
    name: Backend 타입 체크 (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치 (자체 캐시 활성화)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Python 3.13 설치
        run: uv python install 3.13

      # 서드파티 스텁을 backend/.venv에서 읽는다([tool.pyright]의 venvPath/venv).
      # 동기화를 건너뛰면 fastapi·sqlmodel이 전부 unresolved가 되어, 정작 잡아야 할
      # 주입 지점의 타입 어긋남이 import 오류에 묻힌다.
      - name: backend 의존성 동기화
        run: uv sync --project backend

      - name: pyright 실행
        run: uv run --project backend pyright --project backend

  nat-test:
    name: finus_nat pytest
    runs-on: ubuntu-latest
    # 아래 "벤더 패치 적용 검증" 스텝이 uv sync가 만든 실제 venv를 patch_vendor.py로 직접
    # 쓴다. uv 기본 link mode(hardlink)면 site-packages 파일이 ~/.cache/uv/archive-v0/...와
    # inode를 공유하고, 패치 스크립트가 그걸 truncate+rewrite하면서 enable-cache: true가
    # 저장한 캐시가 이미 패치된 상태로 오염된다. 그러면 다음 실행부터 uv sync가 오염된
    # 캐시를 하드링크해 오고, 스크립트는 already만 보고 exit 0으로 통과해 이 검증 스텝이
    # 아무것도 검증하지 못하게 된다. copy 모드로 강제해 캐시와 venv의 inode를 분리한다.
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치 (자체 캐시 활성화)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Python 3.13 설치
        run: uv python install 3.13

      - name: finus_nat 의존성 동기화
        run: uv sync --project finus_nat

      - name: finus_nat 테스트 실행
        run: uv run --project finus_nat pytest finus_nat/tests/

      # 벤더 패치는 NAT·mem0 상류 소스와 바이트 단위로 맞물려 있다. 상류가 바뀌면
      # 패치가 조용히 안 붙는데, 위 pytest는 임시 디렉터리의 가짜 트리만 검증하므로
      # 이를 잡지 못한다. 이 스텝은 uv sync가 설치한 실제 패키지에 스크립트를 돌려
      # 의존성 갱신 PR 시점에 drift를 빨간불로 드러낸다.
      # Dockerfile과 동일하게 네 대상 전부를 --require로 건다(scripts/patch_vendor.py
      # 상단 docstring 참고). 하나만 걸던 시절엔 여기가 Dockerfile보다 넓은 검증
      # 지점이었지만, Dockerfile도 네 개 전부를 강제하게 되면서 두 집합은 같아졌다.
      - name: 벤더 패치 적용 검증 (NAT 상류 drift 사전 감지)
        run: |
          uv run --project finus_nat python finus_nat/scripts/patch_vendor.py \
            --venv finus_nat/.venv \
            --require nat/plugins/mem0ai/memory.py \
            --require mem0/client/main.py \
            --require nat/plugins/mem0ai/mem0_editor.py \
            --require nat/plugins/langchain/agent/auto_memory_wrapper/agent.py

  mcp-trading-test:
    name: mcp-trading npm test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-trading
    steps:
      - uses: actions/checkout@v4

      - name: Node 24 설치 (npm 캐시 활성화)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mcp-trading/package-lock.json

      - name: npm 의존성 설치
        run: npm ci

      - name: mcp-trading 테스트 실행
        run: npm test

  # mcp-news는 tests/와 npm test를 갖고 있으면서도 잡이 없어 CI에서 한 번도 돌지
  # 않았다(hadolint 매트릭스에만 들어 있었다). mcp-trading·mcp-dart와 같은 구성이다.
  mcp-news-test:
    name: mcp-news npm test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-news
    steps:
      - uses: actions/checkout@v4

      - name: Node 24 설치 (npm 캐시 활성화)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mcp-news/package-lock.json

      - name: npm 의존성 설치
        run: npm ci

      - name: mcp-news 테스트 실행
        run: npm test

  mcp-dart-test:
    name: mcp-dart npm test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-dart
    steps:
      - uses: actions/checkout@v4

      - name: Node 24 설치 (npm 캐시 활성화)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mcp-dart/package-lock.json

      - name: npm 의존성 설치
        run: npm ci

      - name: mcp-dart 테스트 실행
        run: npm test

  # frontend/Assets(Unity 소스)를 고치고도 frontend/Build(WebGL 번들)를 재빌드하지 않으면
  # git이 추적하는 번들과 소스가 조용히 어긋난다(이슈 #212·PR #226에서 재빌드 절차를
  # frontend/README.md에 문서화했으나 강제 장치는 없었다). 이 잡은 그 강제 장치다.
  # 스텝이 둘인 이유 — 앞은 "Assets를 고쳤는데 Build가 그대로인가"(재빌드를 아예
  # 빠뜨린 경우), 뒤는 "이 번들이 지금 이 소스에서 나온 것인가"(재빌드 뒤 소스를 한 번
  # 더 고친 경우, #345)를 본다. 앞 스텝만으로는 뒤 상태를 잡지 못한다.
  unity-build-drift:
    name: Unity 소스/번들 드리프트 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request의 체크아웃 대상은 PR head가 아니라 머지 커밋(refs/pull/N/merge)이고,
          # 그 1번 부모가 곧 비교 기준(base)이다. depth 2면 이벤트 payload의 base.sha에
          # 의존하지 않고 체크아웃과 항상 자기일관적인 기준을 얻는다 — 재실행으로 payload는
          # 낡고 머지 ref만 재계산된 경우에도 둘이 어긋나지 않는다.
          # depth 1에서는 shallow graft가 부모를 가려 HEAD^1이 해석되지 않는다.
          # fetch-depth: 0(전체 이력)은 이 잡 하나를 위해 과하고, depth 2는 머지 커밋과
          # blob을 대부분 공유하는 델타만 받는다.
          fetch-depth: 2

      - name: Assets 변경 시 Build 동반 커밋 여부 확인
        # 이 스텝만 pull_request 전용이다. push(=머지 시점) 트리거는 체크아웃 대상이
        # 머지 커밋이 아니라 푸시된 커밋이라 아래 HEAD^1 기준이 다른 것을 가리킨다.
        # 어차피 이 스텝이 보는 건 "이 PR이 Assets와 Build를 함께 건드렸는가"라
        # 머지 후 다시 볼 이유도 없다. 아래 스탬프 대조는 diff 기준이 필요 없으므로
        # push에서도 그대로 돈다.
        if: github.event_name == 'pull_request'
        # Actions의 `run:` 기본 셸은 `bash -e {0}`이라 pipefail이 꺼져 있다. 아래는 파이프를
        # 쓰지 않아 set -e가 git 실패를 직접 잡지만, 셸을 명시해 두면(-eo pipefail) 나중에
        # 파이프가 추가돼도 이 검사가 fail-open으로 무너지지 않는다.
        shell: bash
        run: |
          BASE=$(git rev-parse HEAD^1)
          # 감시 대상은 Scripts/가 아니라 Assets/ 전체다. frontend/README.md의 재빌드 규칙
          # 원문이 Assets/ 전체를 대상으로 하고, WebGLTemplates/·Scenes/·Resources/·
          # Plugins/WebGL/*.jslib 모두 WebGL 번들에 구워진다. .meta도 제외하지 않는다 —
          # 새 에셋 추가는 .meta 동반이면서 실제로 재빌드가 필요하다.
          SRC=$(git diff --name-only "$BASE" HEAD -- frontend/Assets/)
          BUILD=$(git diff --name-only "$BASE" HEAD -- frontend/Build/)
          if [ -n "$SRC" ] && [ -z "$BUILD" ]; then
            echo "::error::frontend/Assets/ 를 수정했으나 frontend/Build/ 가 갱신되지 않았습니다. Unity WebGL 재빌드 후 frontend/Build/를 함께 커밋하세요 (frontend/README.md의 재빌드 규칙 참고)."
            echo "변경된 소스 파일:"
            echo "$SRC" | sed 's/^/  /'
            exit 1
          fi

      # 위 스텝은 "둘 다 변했는가"만 본다. 재빌드한 뒤 소스를 한 번 더 고친 상태는
      # 둘 다 변한 것으로 보여 그대로 통과했고, PR #262에서 실제로 두 번 그 상태가
      # 됐다(#345). 이 스텝은 번들이 **어느 소스에서 나왔는지**를 대조한다 —
      # frontend/build-stamp.txt에 적힌 재빌드 시점의 Assets/·Build/ 트리 해시가
      # 지금 커밋된 두 디렉터리의 트리 해시와 각각 같아야 한다.
      # 다만 이것도 보증은 아니다. write를 진짜 재빌드 직후에 실행했는지는 CI가 알 수
      # 없고, 재빌드 커밋과 소스 수정 커밋을 나누면 두 스텝을 모두 통과한다.
      # 잔여 위험과 그 이유는 frontend/README.md에 적어 두었다.
      - name: 번들 스탬프와 현재 트리 대조
        shell: bash
        run: scripts/frontend_build_stamp.sh check

  docker-lint:
    name: Dockerfile hadolint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - backend/Dockerfile
          - finus_nat/Dockerfile
          - mcp-news/Dockerfile
          - mcp-trading/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: hadolint 실행 - ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # Dockerfile 부채(#52)가 정리됐으므로 warning까지 차단해 신규 부채 유입을 막는다.
          failure-threshold: warning

  # frontend/nginx.conf.template은 컨테이너가 뜰 때만 파싱되므로, 문법이 깨져도 PR
  # 단계에서는 아무 잡도 실패하지 않고 docker compose up에서야 드러난다. compose가
  # 마운트하는 것과 같은 경로에 걸어 nginx -t로 검증한다.
  #
  # conf.d가 아니라 templates에 거는 것이 핵심이다(#266 3단계). 기동 스크립트가 envsubst로
  # `${FINUS_API_KEY}`를 치환한 뒤에야 nginx가 읽을 수 있는 설정이 되므로, 예전처럼
  # conf.d에 직접 걸면 치환되지 않은 `${...}`를 검증하게 되어 실제로 뜨는 것과 다른 파일을
  # 보는 잡이 된다. `nginx -t`도 이미지 엔트리포인트를 타므로($1이 nginx면
  # /docker-entrypoint.d/*.sh가 먼저 돈다) 치환은 이 명령 하나로 함께 일어난다.
  nginx-config-check:
    name: nginx.conf.template 문법 검증
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 키가 비어 있는 배포(기본값)와 채운 배포는 치환 결과가 다르다 — 빈 값은
        # `set $finus_api_key "";`가 되고 Set-Cookie를 만드는 map이 빈 문자열 분기를
        # 탄다. 한쪽만 검증하면 다른 쪽에서만 깨지는 문법 오류가 초록불로 지나간다.
        include:
          - label: 키 미설정
            api_key: ""
          - label: 키 설정
            api_key: ci-syntax-check-key
    steps:
      - uses: actions/checkout@v4

      - name: nginx -t 실행 (${{ matrix.label }})
        run: |
          docker run --rm \
            -e FINUS_API_KEY="${{ matrix.api_key }}" \
            -e NGINX_ENVSUBST_FILTER='^FINUS_' \
            -v "${{ github.workspace }}/frontend/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            nginx:alpine nginx -t
