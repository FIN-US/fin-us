name: CI

# PR과 main 푸시에서 검증을 자동 실행한다.
# main 직접 푸시는 브랜치 보호로 막혀 있으므로 push 트리거는 사실상 머지 시점에만 발화한다.
on:
  pull_request:
  push:
    branches: [main]

# 동일 브랜치에서 새 푸시가 일어나면 이전 실행을 취소해 자원을 절약한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치 (자체 캐시 활성화)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Python 3.13 설치
        run: uv python install 3.13

      - name: backend 의존성 동기화
        run: uv sync --project backend

      - name: backend 테스트 실행
        run: uv run --project backend pytest backend/tests/

  nat-test:
    name: finus_nat pytest
    runs-on: ubuntu-latest
    # 아래 "벤더 패치 적용 검증" 스텝이 uv sync가 만든 실제 venv를 patch_vendor.py로 직접
    # 쓴다. uv 기본 link mode(hardlink)면 site-packages 파일이 ~/.cache/uv/archive-v0/...와
    # inode를 공유하고, 패치 스크립트가 그걸 truncate+rewrite하면서 enable-cache: true가
    # 저장한 캐시가 이미 패치된 상태로 오염된다. 그러면 다음 실행부터 uv sync가 오염된
    # 캐시를 하드링크해 오고, 스크립트는 already만 보고 exit 0으로 통과해 이 검증 스텝이
    # 아무것도 검증하지 못하게 된다. copy 모드로 강제해 캐시와 venv의 inode를 분리한다.
    env:
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치 (자체 캐시 활성화)
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Python 3.13 설치
        run: uv python install 3.13

      - name: finus_nat 의존성 동기화
        run: uv sync --project finus_nat

      - name: finus_nat 테스트 실행
        run: uv run --project finus_nat pytest finus_nat/tests/

      # 벤더 패치는 NAT·mem0 상류 소스와 바이트 단위로 맞물려 있다. 상류가 바뀌면
      # 패치가 조용히 안 붙는데, 위 pytest는 임시 디렉터리의 가짜 트리만 검증하므로
      # 이를 잡지 못한다. 이 스텝은 uv sync가 설치한 실제 패키지에 스크립트를 돌려
      # 의존성 갱신 PR 시점에 drift를 빨간불로 드러낸다.
      # Dockerfile과 동일하게 네 대상 전부를 --require로 건다(scripts/patch_vendor.py
      # 상단 docstring 참고). 하나만 걸던 시절엔 여기가 Dockerfile보다 넓은 검증
      # 지점이었지만, Dockerfile도 네 개 전부를 강제하게 되면서 두 집합은 같아졌다.
      - name: 벤더 패치 적용 검증 (NAT 상류 drift 사전 감지)
        run: |
          uv run --project finus_nat python finus_nat/scripts/patch_vendor.py \
            --venv finus_nat/.venv \
            --require nat/plugins/mem0ai/memory.py \
            --require mem0/client/main.py \
            --require nat/plugins/mem0ai/mem0_editor.py \
            --require nat/plugins/langchain/agent/auto_memory_wrapper/agent.py

  mcp-trading-test:
    name: mcp-trading npm test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-trading
    steps:
      - uses: actions/checkout@v4

      - name: Node 24 설치 (npm 캐시 활성화)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mcp-trading/package-lock.json

      - name: npm 의존성 설치
        run: npm ci

      - name: mcp-trading 테스트 실행
        run: npm test

  mcp-dart-test:
    name: mcp-dart npm test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-dart
    steps:
      - uses: actions/checkout@v4

      - name: Node 24 설치 (npm 캐시 활성화)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: mcp-dart/package-lock.json

      - name: npm 의존성 설치
        run: npm ci

      - name: mcp-dart 테스트 실행
        run: npm test

  # 타입 체크·테스트·빌드는 같은 워킹디렉터리와 같은 lockfile을 쓰므로 한 잡으로 묶어
  # checkout + setup-node + npm ci 중복을 없앤다. 스텝이 순차 실행되므로 실패 지점은
  # 스텝 이름으로 그대로 구분된다.
  #
  # 빌드 스텝이 필요한 이유: tsc --noEmit은 타입만 본다. 번들러 설정·에셋 처리와
  # vite.config.ts 자체의 오류(테스트 인프라 도입으로 test 블록이 추가됐다)는
  # 실제로 vite build를 돌려야만 드러난다.
  frontend-check:
    name: Frontend tsc + vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4

      - name: Node 24 설치 (npm 캐시 활성화)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: npm 의존성 설치
        run: npm ci

      - name: 타입 체크
        run: npx tsc --noEmit

      - name: 프론트엔드 테스트 실행
        run: npm test

      - name: 프로덕션 빌드
        run: npm run build

  # frontend/Assets/Scripts(Unity 소스)를 고치고도 frontend/Build(WebGL 번들)를 재빌드하지
  # 않으면 git이 추적하는 번들과 소스가 조용히 어긋난다(이슈 #212·PR #226에서 재빌드 절차를
  # frontend/README.md에 문서화했으나 강제 장치는 없었다). 이 잡은 그 강제 장치다.
  unity-build-drift:
    name: Unity 소스/번들 드리프트 검사
    # github.base_ref·github.event.pull_request.base.sha는 pull_request 이벤트에서만
    # 채워진다. main push(=머지 시점) 트리거에서는 비교 대상이 없어(빈 문자열) 아래
    # 스크립트가 오작동하므로 PR에서만 돈다. 어차피 이 검사가 보는 건 "이 PR이
    # Assets/Scripts와 Build를 함께 건드렸는가"이므로 머지된 뒤 다시 볼 이유도 없다.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # fetch-depth: 0(전체 이력)은 받지 않는다. 이 저장소를 실측하면 전체 이력 pack이
        # 약 56MB로 크지는 않지만(Build/ 산출물이 매 커밋 66MB씩 쌓이는 게 아니라 git이
        # 동일 blob을 공유하기 때문), 그래도 이 잡 하나만을 위해 매 PR마다 전체 이력을
        # 끌어올 이유는 없다. 아래에서 base 커밋 하나만 별도로 얕게 fetch해 두 커밋을
        # two-dot(`A B`) diff로 직접 비교한다 — two-dot diff는 공통 조상(merge-base)을
        # 요구하지 않으므로 기본 얕은 체크아웃(depth 1) 그대로도 동작한다.
        # (three-dot `A...B`는 merge-base가 필요해 얕은 클론에서 "no merge base"로 실패함을
        # 로컬에서 확인했다.)

      - name: base 커밋만 얕게 fetch
        run: git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}

      - name: Assets/Scripts 변경 시 Build 동반 커밋 여부 확인
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          SRC=$(git diff --name-only "$BASE" HEAD -- frontend/Assets/Scripts/ | wc -l)
          BUILD=$(git diff --name-only "$BASE" HEAD -- frontend/Build/ | wc -l)
          if [ "$SRC" -gt 0 ] && [ "$BUILD" -eq 0 ]; then
            echo "::error::frontend/Assets/Scripts/ 를 수정했으나 frontend/Build/ 가 갱신되지 않았습니다. Unity WebGL 재빌드 후 frontend/Build/를 함께 커밋하세요 (frontend/README.md의 재빌드 규칙 참고)."
            exit 1
          fi

  docker-lint:
    name: Dockerfile hadolint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - backend/Dockerfile
          - finus_nat/Dockerfile
          - frontend-react/Dockerfile
          - mcp-news/Dockerfile
          - mcp-trading/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: hadolint 실행 - ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # Dockerfile 부채(#52)가 정리됐으므로 warning까지 차단해 신규 부채 유입을 막는다.
          failure-threshold: warning
