[project]
name = "fin-us-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.136,<0.137",
  "uvicorn>=0.46,<0.47",
  "pydantic>=2.13,<2.14",
  "python-dotenv>=1.2,<2",
  "openai>=2.36,<3",
  "anthropic>=0.100,<0.101",
  "mcp>=1.27,<1.28",
  "pyyaml>=6.0,<7",
  "httpx>=0.28,<0.29",
  "redis",
  "sqlmodel>=0.0.38,<0.0.39",
  "websockets>=16,<17",
  "apscheduler>=3.11,<3.12",
]

[dependency-groups]
dev = [
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.3,<2",
]

[tool.uv]
package = false
