services:
  # Unity WebGL 빌드(frontend/Build)를 정적 서빙하고, /api·/health는 같은 네트워크의
  # backend:8000으로 프록시한다(#245). file://로는 로더가 동작하지 않아 HTTP 서빙이
  # 필수다(frontend/README.md 참고).
  # depends_on은 일부러 두지 않는다 — nginx 설정이 proxy_pass에 변수를 써서 backend
  # 이름을 요청 시점에 해석하므로, backend가 아직 없어도 nginx는 뜨고 정적 화면이 먼저
  # 보인다. backend를 기다리게 만들면 그 이점이 사라진다.
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    environment:
      # nginx.conf.template의 ${FINUS_API_KEY} 자리를 채운다(#266 3단계). nginx가 문서
      # 응답에 이 키를 SameSite=Strict 쿠키로 실어 보내면, 브라우저가 이후 /api/ 요청과
      # /api/v1/ws 핸드셰이크에 자동으로 붙인다 — 번들을 다시 굽지 않고 키를 들여보내는
      # 경로다. compose가 프로젝트 루트의 .env를 보간에 쓰므로 backend와 같은 값이 된다.
      #
      # ⚠️ `:-`를 지우지 말 것. 값이 없으면 변수가 아예 정의되지 않고, 그러면 envsubst가
      # `${FINUS_API_KEY}`를 문자 그대로 남긴다 — nginx는 그것을 정의되지 않은 변수로
      # 보고 기동에 실패하므로, 인증을 쓰지 않는 배포에서 정적 화면까지 함께 죽는다.
      #
      # env_file을 붙이지 않는 것도 의도다. .env 전체를 nginx 컨테이너에 넣으면 이
      # 설정이 쓰지도 않는 KIS·OpenAI 키까지 함께 퍼진다.
      FINUS_API_KEY: ${FINUS_API_KEY:-}
      # 치환 대상을 FINUS_* 하나로 좁힌다. 기본값은 "환경에 정의된 모든 변수"라,
      # 컨테이너 환경에 nginx 변수와 같은 이름이 생기는 날 설정의 `$host`·`$uri`가
      # 조용히 치환된다.
      NGINX_ENVSUBST_FILTER: ^FINUS_
    volumes:
      # 번들은 호스트의 Unity 빌드 산출물이 원본이므로 컨테이너에서는 읽기 전용으로만 쓴다.
      - ./frontend/Build:/usr/share/nginx/html:ro
      # conf.d가 아니라 templates다(#266 3단계). 기동 스크립트
      # (/docker-entrypoint.d/20-envsubst-on-templates.sh)가 envsubst로 치환해
      # /etc/nginx/conf.d/default.conf를 만든다. 키를 바꾸면 이 컨테이너를 다시 만들어야
      # 반영된다(치환은 기동 시점에 한 번뿐이다) — `docker compose up -d frontend`.
      - ./frontend/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - fin-us-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      # 기본값에서는 인증이 없는 API이고(#266 2단계의 FINUS_API_KEY를 채운 배포에서만
      # 걸린다), /api/v1/analyze 한 번이 LLM 과금으로 이어진다. 번들이 상대
      # 경로로 재빌드돼(#262) 원격 시연의 8000 직접 호출 의존이 사라졌으므로 127.0.0.1에만
      # 바인딩한다(#246). 전 인터페이스에 열어 두면 nginx에 건 레이트리밋(#266 1단계,
      # frontend/nginx.conf.template)을 8000 직접 호출로 그대로 우회할 수 있다 — 막는 게
      # 아니라 막는 것처럼 보이는 상태가 된다.
      # 게시를 없애지 않는 것은 호스트에서 /docs를 열거나 수동으로 API를 부르는 흐름과,
      # Unity 에디터 플레이 모드(ApiClient.DefaultBaseUrl이 http://localhost:8000으로
      # 폴백한다) 때문이다. 브라우저는 8080 프록시로, nginx는 backend:8000 별칭으로
      # 닿으므로 좁혀도 기능 영향은 없다.
      - "127.0.0.1:8000:8000"
    volumes:
      - .:/app
      - /app/backend/.venv
    env_file:
      - ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NAT_BASE_URL: http://finus-nat:8000
      NEWS_MCP_DIR: /opt/mcp-news
      TRADING_MCP_DIR: /opt/mcp-trading
      DART_MCP_DIR: /opt/mcp-dart
      REDIS_URL: redis://redis:6379/0
      # 주문 멱등 원장(#124). `.:/app` bind mount 덕분에 호스트 ./.state/ 에 영속된다.
      # 소스를 bind mount하지 않는 배포용 compose를 도입하면 named volume으로 전환할 것.
      KIS_ORDER_DEDUP_PATH: ${KIS_ORDER_DEDUP_PATH:-/app/.state/kis-order-dedup.json}
    depends_on:
      finus-nat:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - fin-us-network

  finus-nat:
    build:
      context: .
      dockerfile: finus_nat/Dockerfile
    ports:
      # 무인증 `/v1/chat/completions`를 그대로 받는 LLM 호출 경로라 127.0.0.1에만
      # 바인딩한다(#285). 전 인터페이스에 열어 두면 `/api/v1/analyze`의 레이트리밋
      # (#266 1단계, frontend/nginx.conf.template)을 8001 직접 호출로 우회할 수 있다.
      # 컴포즈 내부에서는 backend가 `NAT_BASE_URL: http://finus-nat:8000` 네트워크 별칭으로
      # 부르므로 영향이 없다.
      # 게시를 남겨 두는 것은 수동 디버깅과, 호스트에서 백엔드만 띄울 때 쓰는
      # `.env.example`의 `NAT_BASE_URL=http://127.0.0.1:8001`을 위해서다.
      - "127.0.0.1:8001:8000"
    volumes:
      - .:/workspace
      # 이미지 빌드 시 설치한 node_modules·venv가 bind mount에 가려지지 않도록 보존
      - /workspace/finus_nat/.venv
      - /workspace/mcp-news/node_modules
      - /workspace/mcp-trading/node_modules
      - /workspace/mcp-dart/node_modules
    env_file:
      - ./.env
    environment:
      FINUS_VENDOR_ROOT: /workspace
      FINUS_ROOT: /workspace
      FINUS_ENV_PATH: /workspace/.env
      FINUS_BACKEND_URL: http://backend:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - fin-us-network

  redis:
    image: redis:7-alpine
    ports:
      # 인증(`requirepass`)이 없는 인스턴스이고, 대기 주문(`RedisPendingOrderStore`)과
      # 폴러 offset·`_handled_ahead`(#248), 스케줄러 락처럼 금전 경로의 상태가 들어
      # 있으므로 127.0.0.1에만 바인딩한다(#285). 게시 자체를 없애지 않는 이유는
      # 호스트에서 `uvicorn --reload`로 백엔드만 띄우는 흐름이 `.env.example`의
      # `REDIS_URL=redis://127.0.0.1:6379/0`에 의존하기 때문이다. 컴포즈 내부 통신은
      # `redis:6379` 별칭을 쓴다.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fin-us-network

networks:
  fin-us-network:
    driver: bridge
