services:
  frontend:
    build:
      context: ./frontend-react
    ports:
      # nginx 컨테이너는 80번 포트로 서빙 (호스트 5173 → 컨테이너 80)
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fin-us-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/backend/.venv
    env_file:
      - ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NAT_BASE_URL: http://finus-nat:8000
      NEWS_MCP_DIR: /opt/mcp-news
      TRADING_MCP_DIR: /opt/mcp-trading
      DART_MCP_DIR: /opt/mcp-dart
      REDIS_URL: redis://redis:6379/0
    depends_on:
      finus-nat:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - fin-us-network

  finus-nat:
    build:
      context: .
      dockerfile: finus_nat/Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - ./.env
    environment:
      FINUS_VENDOR_ROOT: /workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - fin-us-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fin-us-network

networks:
  fin-us-network:
    driver: bridge
