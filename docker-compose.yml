services:
  # Unity WebGL 빌드(frontend/Build)를 정적 서빙하고, /api·/health는 같은 네트워크의
  # backend:8000으로 프록시한다(#245). file://로는 로더가 동작하지 않아 HTTP 서빙이
  # 필수다(frontend/README.md 참고).
  # depends_on은 일부러 두지 않는다 — nginx.conf가 proxy_pass에 변수를 써서 backend
  # 이름을 요청 시점에 해석하므로, backend가 아직 없어도 nginx는 뜨고 정적 화면이 먼저
  # 보인다. backend를 기다리게 만들면 그 이점이 사라진다.
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      # 번들은 호스트의 Unity 빌드 산출물이 원본이므로 컨테이너에서는 읽기 전용으로만 쓴다.
      - ./frontend/Build:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - fin-us-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/backend/.venv
    env_file:
      - ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NAT_BASE_URL: http://finus-nat:8000
      NEWS_MCP_DIR: /opt/mcp-news
      TRADING_MCP_DIR: /opt/mcp-trading
      DART_MCP_DIR: /opt/mcp-dart
      REDIS_URL: redis://redis:6379/0
      # 주문 멱등 원장(#124). `.:/app` bind mount 덕분에 호스트 ./.state/ 에 영속된다.
      # 소스를 bind mount하지 않는 배포용 compose를 도입하면 named volume으로 전환할 것.
      KIS_ORDER_DEDUP_PATH: ${KIS_ORDER_DEDUP_PATH:-/app/.state/kis-order-dedup.json}
    depends_on:
      finus-nat:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - fin-us-network

  finus-nat:
    build:
      context: .
      dockerfile: finus_nat/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - .:/workspace
      # 이미지 빌드 시 설치한 node_modules·venv가 bind mount에 가려지지 않도록 보존
      - /workspace/finus_nat/.venv
      - /workspace/mcp-news/node_modules
      - /workspace/mcp-trading/node_modules
      - /workspace/mcp-dart/node_modules
    env_file:
      - ./.env
    environment:
      FINUS_VENDOR_ROOT: /workspace
      FINUS_ROOT: /workspace
      FINUS_ENV_PATH: /workspace/.env
      FINUS_BACKEND_URL: http://backend:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - fin-us-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fin-us-network

networks:
  fin-us-network:
    driver: bridge
