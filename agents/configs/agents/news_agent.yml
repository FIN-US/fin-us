base: monitoring_agent.yml
# base: 체인의 성격과 공유 도구 정의 위치는 configs/common.yml 상단 주석을 참조한다 (#284).

llms:
  news_openai_llm:
    _type: openai
    api_key: ${OPENAI_API_KEY}
    base_url: ${OPENAI_API_BASE_URL:-${OPENAI_BASE_URL:-https://api.openai.com/v1}}
    model_name: ${NEWS_OPENAI_CHAT_MODEL:-gpt-5.4-mini}

functions:
  news_agent:
    # 첫 턴 도구 호출을 API로 강제한다(#394). 벤더 react_agent에서는 모델이 첫 턴에
    # Final Answer로 끝내 도구를 한 번도 부르지 않았다 — 근거는 finus_agents/tool_first_react.py.
    _type: finus_tool_first_react_agent
    llm_name: news_openai_llm
    tool_names:
      - kis-trading-mcp-tool-readonly
      # news agent가 실수로 주식거래를 해버리는 위험을 막기 위해 향후에 다른 것으로 변경
      - mcp-news-get-market-news
      - mcp-dart-get-disclosure-signal
      - mcp-dart-get-earnings-report
      - add_user_memory
      - get_user_memory
    # 메모리 도구는 뺀다 — 데이터를 만들지 않는 도구로 강제 호출을 채우고 끝낼 수 있다.
    first_turn_tool_names:
      - kis-trading-mcp-tool-readonly
      - mcp-news-get-market-news
      - mcp-dart-get-disclosure-signal
      - mcp-dart-get-earnings-report
    verbose: false
    use_native_tool_calling: false
    max_history: 8000
    parse_agent_response_max_retries: 2
    raise_on_parsing_failure: false
    system_prompt: file://../prompts/react_news.md
    additional_instructions: |
      시장 뉴스·수급·DART 지분공시 분석가. 종목/시장 관련 질문에는 mcp-news·mcp-dart 도구로 데이터를 가져온 뒤 한국어로 요약·해석합니다.
      사용자가 성격, 선호, 투자 성향, 답변 스타일처럼 오래 유지될 정보를 말하면 `add_user_memory`에 저장하고,
      개인화가 필요하면 `get_user_memory`로 먼저 확인하십시오.

      - 최신 뉴스·헤드라인: `mcp-news-get-market-news` (stock_name = 종목명 또는 6자리 코드).
      - DART 지분공시 signal(5% 룰·임원/주요주주): `mcp-dart-get-disclosure-signal` (stock_name). 매매 지시가 아닌 리스크·맥락 참고용.
      - DART 실적 리포트: `mcp-dart-get-earnings-report` (stock_name, period 선택). 실적·분기보고서·사업보고서·earnings 질문에는 이 도구와 최신 뉴스를 함께 사용합니다.
      - 실적 분석 모드에서는 매출/영업이익/순이익 YoY, 실적 서프라이즈/미스 여부, 주요 뉴스 기반 정성 코멘트, 다음 분기 전망을 구조화해 답하십시오.
        컨센서스 또는 시장 기대치 데이터가 도구 Observation에 없으면 추정하지 말고 "컨센서스 데이터 없음"으로 명시하십시오.
      - 보유종목·포트폴리오 뉴스(사용자가 종목을 정하지 않고 "내가 가진 종목"을 가리킴): 먼저 `kis-trading-mcp-tool-readonly`로
        잔고를 조회하십시오(`api_type:"inquire_balance"`, `params:{{"inqr_dvsn":"01"}}`). 보유 종목은 그 도구 결과의
        `output1` 필드(보유 종목 목록)에서 행마다 있는 `prdt_name` 필드(종목명)입니다. 보유 종목은 이 요청에서 조회한
        잔고로만 정합니다 — 이전 대화에 나온 종목명이나 이 지시문의 종목명을 보유 종목으로 쓰지 마십시오(#449).
        · 목록이 비어 있으면 보유 종목이 없는 것입니다. 뉴스 도구를 호출하지 말고 보유 종목이 없다고만 답하십시오.
          예시·다른 종목·시장 전체 뉴스로 대신하지 마십시오.
        · 목록에 종목이 있으면 그 종목 각각에 대해서만 `mcp-news-get-market-news`를 호출합니다. 수량·평균단가·평가금액 같은
          값이 `<AMOUNT_…>`·`<QTY_…>`처럼 꺾쇠로 가려져 있어도 정상 응답이니 종목명으로 진행하십시오. 꺾쇠 값은 종목명이 아닙니다.
        답에는 필드 이름(`output1`·`prdt_name` 등)을 쓰지 말고 "보유 종목"처럼 풀어 쓰십시오.
      - 사용자가 종목명을 직접 말한 요청은 그 종목만 조회합니다. 이전 대화의 다른 종목을 섞거나 보유종목 뉴스로 바꿔 답하지 마십시오.
        사용자가 "그 종목"처럼 이전 대화의 종목을 가리킬 때만 최근 대화에서 종목명을 가져옵니다.

      도구 Observation을 받기 전에는 Final Answer를 쓰지 마십시오.
      Observation을 받은 뒤 다른 종목도 같은 형식으로 호출하십시오.
      첫 턴에는 항상 도구를 한 번 호출합니다(#394). 그 Observation과 직전 대화 맥락으로 뉴스·수급의 의미, 주가 영향,
      호재/악재 여부, 이유를 답하기에 충분하면 추가 도구 호출 없이 `Thought:` 다음 `Final Answer:` 형식으로 답하십시오.
      `Action:`을 쓰기로 했다면 반드시 바로 다음 줄에 `Action Input:`을 쓰십시오. `Action:`만 쓰고 멈추지 마십시오.
      사용자가 JSON 형식 응답을 요구하면 최종 출력은 JSON 객체 한 개만 반환하고 코드블록/설명 문장은 넣지 않습니다.

  news_branch_agent:
    _type: fe_branch
    inner_function_name: news_agent
    tool_description: "News, investor flows, DART disclosure: Fin-Us mcp-news + mcp-dart."
