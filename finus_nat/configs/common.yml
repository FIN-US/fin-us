# 공용 LLM 및 함수 tools 등록. agents/*.yml 의 base: 체인이 최종적으로 도달하는 파일이다.
#
# base: 자체는 deep-merge 상속이 맞다(nat/utils/io/yaml_tools.py, scripts/run.sh:120).
# 다만 에이전트끼리 이어진 base: 체인은 파생 관계가 아니라 라우터가 6개 에이전트를 한 config로
# 모으기 위한 경로다 - diary -> strategy -> recommend -> news -> monitoring -> trading -> common.
# 여러 에이전트가 공유하는 도구 정의(kis-trading-mcp-tool*)를 이 파일에 둔 것도 그래서다 (#284).
functions:
  # KIS Trading MCP 래퍼 2종. trading/monitoring은 전체 권한, news/recommend/strategy는
  # 조회 전용을 참조한다 (#66). 여러 에이전트가 공유하므로 공용 파일에서 한 번만 정의한다 (#284).
  kis-trading-mcp-tool:
    _type: finus_account_balance
    mcp_transport: sse
    mcp_url: ${FINUS_KIS_TRADING_MCP_URL:-http://host.docker.internal:3300/sse}
    trading_tool_name: ${FINUS_KIS_TRADING_TOOL_NAME:-domestic_stock}

  # #66: news/recommend/strategy 에이전트용 조회 전용 래퍼를 별도 이름으로 등록한다.
  # 병합된 라우터 설정에서 functions 딕셔너리는 이름이 전역인 평평한 네임스페이스이므로,
  # 한 이름에 인스턴스는 하나뿐이다. 따라서 trading/monitoring의 kis-trading-mcp-tool
  # (전체 권한 finus_account_balance)을 건드리지 않고 별도 이름으로 분리해야 한다.
  kis-trading-mcp-tool-readonly:
    _type: finus_account_balance_readonly
    mcp_transport: sse
    mcp_url: ${FINUS_KIS_TRADING_MCP_URL:-http://host.docker.internal:3300/sse}
    trading_tool_name: ${FINUS_KIS_TRADING_TOOL_NAME:-domestic_stock}

  # router_nomemory.yml에서는 memory 도구를 no-op으로 둡니다.
  # router.yml(memory 모드)은 같은 이름을 실제 Mem0 도구로 덮어씁니다.
  add_user_memory:
    _type: finus_memory_disabled
    description: "Memory disabled: acknowledge that durable memory is unavailable and continue with live context only."

  get_user_memory:
    _type: finus_memory_disabled
    description: "Memory disabled: report that no durable memory can be retrieved and continue with live context only."

  # fin-us/mcp-news stdio: get_market_news
  mcp-news-get-market-news:
    _type: finus_market_news

  # fin-us/mcp-dart stdio: get_disclosure_signal
  mcp-dart-get-disclosure-signal:
    _type: finus_disclosure_signal

  # fin-us/mcp-dart stdio: get_earnings_report
  mcp-dart-get-earnings-report:
    _type: finus_earnings_report

llms:
  openai_cloud_llm:
    _type: openai
    # fin-us/backend/.env에 저장된 OPENAI_API_KEY를 사용
    api_key: ${OPENAI_API_KEY}
    base_url: ${OPENAI_API_BASE_URL:-${OPENAI_BASE_URL:-https://api.openai.com/v1}}
    model_name: ${OPENAI_CHAT_MODEL:-gpt-5.4-mini}


  ollama_llm:
    _type: openai
    api_key: ${OLLAMA_API_KEY:-ollama}
    base_url: ${OLLAMA_OPENAI_BASE_URL:-http://127.0.0.1:11434/v1}
    model_name: ""
