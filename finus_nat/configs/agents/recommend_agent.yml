base: news_agent.yml
# base: 체인의 성격과 공유 도구 정의 위치는 configs/common.yml 상단 주석을 참조한다 (#284).
# 사용자의 질문을 기반으로 조건에 맞는 종목을 검색하고 추천하는 에이전트입니다.

llms:
  recommend_openai_llm:
    _type: openai
    api_key: ${OPENAI_API_KEY}
    base_url: ${OPENAI_API_BASE_URL:-${OPENAI_BASE_URL:-https://api.openai.com/v1}}
    model_name: ${RECOMMEND_OPENAI_CHAT_MODEL:-gpt-5.4-mini}

functions:
  recommend_agent:
    _type: react_agent

    llm_name: recommend_openai_llm
    tool_names:
      - kis-trading-mcp-tool-readonly
      - mcp-news-get-market-news
      - add_user_memory
      - get_user_memory
    verbose: false
    use_native_tool_calling: false
    max_history: 8000
    parse_agent_response_max_retries: 2
    raise_on_parsing_failure: false
    system_prompt: file://../prompts/react_recommend.md
    additional_instructions: |
      직전 대화에서 섹터·비교 기준·종목 목록이 이미 정해졌다면, 사용자가 짧게만 말해도 **그 맥락을 유지**하고
      같은 주제로 도구를 쓰거나 답합니다. 이미 정해진 업종/테마를 다시 묻지 마세요.

      사용자의 질문에 따라 조건에 맞는 종목을 추천합니다.
      정형적인 데이터에 기반한 조건을 질문할 경우 kis-trading-mcp-tool-readonly를 호출합니다.
      KIS 조회에서 API/validation 오류가 나면 오류 응답으로 끝내지 말고 `find_api_detail`로 해당 api_type의 필드와 기본값을 확인한 뒤 params를 고쳐 원래 조회를 다시 실행합니다. 이 재시도까지가 성공 조건입니다.
      잔고/포트폴리오 맥락이 필요한 경우 `inquire_balance` 기본값은 params `{{"env_dv":"real","inqr_dvsn":"01"}}` 입니다.
      비정형적인 데이터에 기반한 조건을 질문할 경우 mcp-news 툴을 호출합니다.
      사용자의 투자 성향, 선호 섹터, 제외 조건처럼 오래 유지될 정보가 필요하면 get_user_memory로 확인하고,
      사용자가 그런 정보를 새로 말하면 add_user_memory에 저장합니다.
      최대한 조건에 맞는 종목 하나를 사용자에게 추천하고 만약에 찾지 못했다면 유사한 종목도 제시합니다.
      기본 답변은 항상 평문 한국어입니다. 사용자가 JSON 출력을 명시한 경우에만 JSON 객체 하나만 반환합니다.
      도구가 JSON을 반환해도 사용자에게는 요약·표 형태의 한국어로 설명합니다.


  recommend_gated_branch_agent:
    _type: fe_branch
    inner_function_name: recommend_agent
    tool_description: "Recommendations: KIS MCP context, Fin-Us mcp-news headlines, and user memory when available."

  # 라우터가 부르는 추천 브랜치 (#397). 저장된 투자 성향을 코드가 읽어, 성향이 있을 때만 아래
  # 논조 지시를 현재 요청 앞에 붙인 뒤 위 fe_branch(도구 강제 게이트)로 넘긴다. 성향이 없거나
  # 메모리가 꺼져 있으면 요청을 손대지 않고 그대로 넘긴다 — 미설정 사용자의 추천은 기존과 같다.
  # 지시문에는 숫자를 넣지 않는다(설정 검증이 거부한다): 게이트는 요청에 등장한 수치를 근거로 친다.
  recommend_branch_agent:
    _type: finus_risk_profile_branch
    inner_function_name: recommend_gated_branch_agent
    preferences_function_name: user_preferences
    tool_description: "Recommendations: KIS MCP context, Fin-Us mcp-news headlines, and the user's stored risk profile."
    conservative_guidance: |
      추천 논조: 안정형 사용자입니다. 후보를 제시할 때 변동성·하방 위험·손실 가능성을 기회 요인보다 먼저 짚으세요.
      최근 급등락, 실적 불확실성, 부정적 뉴스처럼 흔들릴 수 있는 이유를 먼저 적고 그다음에 매력 요인을 적으세요.
      변동성이 큰 종목만 조건에 맞는다면 그 사실을 분명히 경고하고, 상대적으로 안정적인 대안이 있으면 함께 제시하세요.
    aggressive_guidance: |
      추천 논조: 공격형 사용자입니다. 후보를 제시할 때 성장 모멘텀·상승 촉매·수급 개선 같은 기회 요인을 먼저 짚으세요.
      변동성이 크다는 이유만으로 후보에서 빼지 말고, 위험 요인은 기회 요인 뒤에 간결하게 덧붙이세요.
      위험 요인을 생략하지는 마세요.
