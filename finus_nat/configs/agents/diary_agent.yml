base: strategy_agent.yml
# base: 체인의 성격과 공유 도구 정의 위치는 configs/common.yml 상단 주석을 참조한다 (#284).
# 해당 에이전트는 당일 거래 내역을 확인하고 이를 기반으로 매매일지 초안을 작성합니다.

llms:
  diary_openai_llm:
    _type: openai
    api_key: ${OPENAI_API_KEY}
    base_url: ${OPENAI_API_BASE_URL:-${OPENAI_BASE_URL:-https://api.openai.com/v1}}
    model_name: ${DIARY_OPENAI_CHAT_MODEL:-gpt-5.4-mini}

functions:
  # 일지 초안에 필요한 조회(당일 주문·체결 + 잔고·보유종목 + 실현손익)를 한 번에 부르는 묶음 도구 (#405).
  # 개별 조회 도구 세 개를 따로 두면 첫 턴 강제로 당일 주문만 조회한 뒤 모델이 잔고 조회로 넘어가지
  # 않았다. 묶음 도구가 날짜·종목 인자도 받으므로 후속 세부 조회도 이것으로 한다.
  mcp-trading-diary-snapshot:
    _type: finus_mcp_trading_diary_snapshot
    timeout_sec: 120

  # fin-us backend REST API — POST/GET /api/v1/db/diary
  finus-save-diary:
    _type: finus_save_diary
    backend_url: ${FINUS_BACKEND_URL:-http://127.0.0.1:8000}
    timeout_sec: 60

  finus-list-diaries:
    _type: finus_list_diaries
    backend_url: ${FINUS_BACKEND_URL:-http://127.0.0.1:8000}
    timeout_sec: 60

  diary_agent:
    # 첫 턴 도구 호출을 API로 강제한다(#399) — trading_agent.yml 주석 참조.
    _type: finus_tool_first_react_agent
    llm_name: diary_openai_llm
    tool_names:
      - mcp-trading-diary-snapshot
      - finus-save-diary
      - finus-list-diaries
    # 조회 도구만 강제한다. 쓰기 도구 finus-save-diary를 넣으면 사용자가 저장을 요청하지 않은
    # 첫 턴에 강제 호출이 저장으로 채워질 수 있다 — 저장은 모델이 텍스트 ReAct로 고를 때만 나간다.
    first_turn_tool_names:
      - mcp-trading-diary-snapshot
      - finus-list-diaries
    verbose: false
    use_native_tool_calling: false
    max_history: 8000
    parse_agent_response_max_retries: 2
    raise_on_parsing_failure: false
    system_prompt: file://../prompts/react_diary.md
    additional_instructions: |
      === 도구 사용 순서 ===
      1. `mcp-trading-diary-snapshot`으로 당일 주문·체결, 계좌 잔고·보유종목, 실현손익을 한 번에 조회합니다.
         결과는 섹션별로 오고, 조회에 실패한 섹션은 `조회 실패`로 표시됩니다. 실패한 섹션의 수치는 지어내지 마세요.
      2. 당일 주문·체결이 있으면 초안을 종목명, 거래금액, 변동율, 매매 구분, 실현손익 순서로 작성합니다.
         당일 주문·체결이 없으면 같은 조회 결과의 잔고·보유종목 요약으로 초안을 작성합니다. 잔고를 다시 조회할 필요는 없습니다.
         모의투자 계좌는 실현손익 대신 잔고 요약이 옵니다. 어느 쪽이든 맨 마지막에 사용자 의견을 적을 공간을 남깁니다.
      3. 사용자가 저장을 요청한 경우에 `finus-save-diary`로 backend에 저장합니다.
      KIS 자격 증명은 fin-us/.env (KIS_URL, KIS_API_KEY, KIS_API_SECRET, KIS_ACCOUNT_NO)에서 mcp-trading이 로드합니다.
      저장 API 오류 시 오류를 알리고 초안은 최종 답변에 포함하세요.

      과거 일지를 조회하고 싶다면 `finus-list-diaries`를 사용하세요.


  diary_branch_agent:
    _type: fe_branch
    inner_function_name: diary_agent
    tool_description: "Trading diary: mcp-trading 당일 주문·체결 + 잔고·보유종목 + 실현손익 → 매매일지 초안 작성 (저장은 사용자 요청 시)."
