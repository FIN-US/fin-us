base: strategy_agent.yml
# base: 체인의 성격과 공유 도구 정의 위치는 configs/common.yml 상단 주석을 참조한다 (#284).
# 해당 에이전트는 당일 거래 내역을 확인하고 이를 기반으로 매매일지 초안을 작성합니다.

llms:
  diary_openai_llm:
    _type: openai
    api_key: ${OPENAI_API_KEY}
    base_url: ${OPENAI_API_BASE_URL:-${OPENAI_BASE_URL:-https://api.openai.com/v1}}
    model_name: ${DIARY_OPENAI_CHAT_MODEL:-gpt-5.4-mini}

functions:
  mcp-trading-today-orders:
    _type: finus_mcp_trading_today_orders
    timeout_sec: 120

  mcp-trading-balance-rlz-pl:
    _type: finus_mcp_trading_balance_rlz_pl
    timeout_sec: 120

  mcp-trading-get-balance:
    _type: finus_mcp_trading_get_balance
    timeout_sec: 120

  # fin-us backend REST API — POST/GET /api/v1/db/diary
  finus-save-diary:
    _type: finus_save_diary
    backend_url: ${FINUS_BACKEND_URL:-http://127.0.0.1:8000}
    timeout_sec: 60

  finus-list-diaries:
    _type: finus_list_diaries
    backend_url: ${FINUS_BACKEND_URL:-http://127.0.0.1:8000}
    timeout_sec: 60

  diary_agent:
    _type: react_agent
    llm_name: diary_openai_llm
    tool_names:
      - mcp-trading-today-orders
      - mcp-trading-get-balance
      - mcp-trading-balance-rlz-pl
      - finus-save-diary
      - finus-list-diaries
    verbose: false
    use_native_tool_calling: false
    max_history: 8000
    parse_agent_response_max_retries: 2
    raise_on_parsing_failure: false
    system_prompt: file://../prompts/react_diary.md
    additional_instructions: |
      === 도구 사용 순서 ===
      1.`mcp-trading-today-orders`를 사용하여 당일주문내역을 가져옵니다. 해당 조건의 주문·체결이 없다면 2번으로 바로 넘어가세요
        당일 주문 내역이 있다면 `mcp-trading-balance-rlz-pl`로 실현·평가 손익을 조회합니다.
        모의투자(KIS_URL에 openapivts)이거나 해당 도구가 실전 전용 오류를 반환하면 `mcp-trading-get-balance`로 대체하세요.
        tool 호출 결과로 매매일지 초안을 작성합니다. 초안은 종목명, 거래금액, 변동율, 매매 구분, 실현손익 순서로 작성하고 사용자 의견을 적을 공간을 남깁니다.

      2. 당일 거래내역이 없다면 `mcp-trading-get-balance`로 계좌·보유종목 요약을 조회합니다.
         조회 결과로 초안을 작성하고 맨 마지막에 사용자 의견을 적을 공간을 남깁니다.

      3. 사용자가 저장을 요청한 경우에 `finus-save-diary`로 backend에 저장합니다.
      KIS 자격 증명은 fin-us/.env (KIS_URL, KIS_API_KEY, KIS_API_SECRET, KIS_ACCOUNT_NO)에서 mcp-trading이 로드합니다.
      저장 API 오류 시 오류를 알리고 초안은 최종 답변에 포함하세요.

      과거 일지를 조회하고 싶다면 `finus-list-diaries`를 사용하세요.


  diary_branch_agent:
    _type: fe_branch
    inner_function_name: diary_agent
    tool_description: "Trading diary: mcp-trading 당일 주문·체결 + 실현손익 → 매매일지 초안 작성 (저장은 사용자 요청 시)."
