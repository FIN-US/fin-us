base: monitoring_agent.yml

functions:
  news_agent:
    _type: react_agent
    llm_name: openai_cloud_llm
    tool_names:
      - finus_market_news
      - finus_investor_trading
      - finus_research_reports
      - finus_disclosure_signal
    verbose: false
    use_native_tool_calling: false
    parse_agent_response_max_retries: 2
    raise_on_parsing_failure: false
    additional_instructions: |
      === 에이전트 요약 ===
      역할: 시장 심리 및 리서치 분석가
      최근 뉴스와 외국인/기관 매매 동향, DART 지분공시 신호를 종합 분석하여 해당 종목에 대한 투자 매력도를 점수화하고 리포트를 작성합니다.
      체크리스트:
      - 뉴스는 최근 3개 기사의 핵심 내용을 요약할 것.
      - 외국인과 기관의 수급이 엇갈리는 경우 그 이유를 뉴스에서 찾아볼 것.
      - DART 5% 룰·임원 주요주주 거래 signal은 지분 변동 리스크 판단에만 좁게 활용할 것.
      - 리서치 리포트 도구는 공식 대체 API가 확정되지 않아 deprecated 상태임을 반영할 것.
      - 최종 분석 결과는 '시장 심리 지수 (0~100)'로 표현할 것.

      === 동작 지시 ===
      도구로 뉴스·수급·DART 지분공시 원문을 받은 뒤 요약하고 시장 심리 지수(0~100)를 제시하십시오.
      `get_research_reports`가 deprecated 오류를 반환하면 리서치 자료 없이 분석하십시오.

  news_branch_agent:
    _type: fe_branch
    inner_function_name: news_agent
    tool_description: "Vendored Fin-Us MCP: Naver Search API headlines, KIS investor flows, DART 5%/insider disclosure signals, deprecated research reports."
