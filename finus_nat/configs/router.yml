base: agents/verifier_agent.yml
# base 사슬: verifier_agent.yml -> diary_agent.yml -> ... -> common.yml (#299).
# 검증자 config를 diary와 라우터 사이에 끼워, 라우터가 로드하는 설정에
# backend 전용 엔드포인트(주문 보조 2개, 사용자 선호 1개)와 order_verifier가 함께 들어오게 한다.
# supervisor의 브랜치 6개는 불변이다 — 검증자는 브랜치가 아니며 채팅으로 도달할 수 없다.
# src/nat_finus_nat/supervisor.py 의 router_supervisor_agent 설정을 확장합니다(common.yml 상속).
# 메모리 모드(기본값, #397): mem0 로컬 스토리지 + 사용자 선호(투자 성향) 허용목록.
# FINUS_MEM0_ENABLED=0 이면 run.sh·Dockerfile이 router_nomemory.yml을 고릅니다.
llms:
  router_openai_llm:
    _type: openai
    api_key: ${OPENAI_API_KEY}
    base_url: ${OPENAI_API_BASE_URL:-${OPENAI_BASE_URL:-https://api.openai.com/v1}}
    model_name: ${ROUTER_OPENAI_CHAT_MODEL:-gpt-5.4-mini}

# mem0를 이 프로세스 안에서 로컬 파일로 띄웁니다(nat_finus_nat/mem0_local.py). 외부 서비스·
# 텔레메트리·외부 임베딩을 쓰지 않습니다. 저장할 수 있는 것은 허용목록의 선호 값뿐입니다
# (nat_finus_nat/user_memory.py). NAT의 mem0_memory(HTTP 클라이언트 → self-hosted 서버나
# api.mem0.ai)는 쓰지 않습니다.
memory:
  finus_user_memory:
    _type: finus_mem0_local_memory
    storage_dir: ${FINUS_MEM0_STORAGE_DIR:-.state/mem0}

functions:
  user_preferences:
    _type: finus_user_preferences
    memory_name: finus_user_memory

  # 에이전트는 사용자 메모리에 쓸 수 없습니다 — 성향은 텔레그램 /risk로만 저장합니다.
  add_user_memory:
    _type: finus_user_memory_add_refused
    description: "Agents cannot store user memory. The investment risk profile is set only by the user via the Telegram /risk command."

  get_user_memory:
    _type: finus_user_memory_get
    preferences_function_name: user_preferences
    description: "Read the current user's stored preferences (investment risk profile). Returns a note when nothing is stored."

  router_supervisor_agent:
    _type: finus_supervisor_agent
    llm_name: router_openai_llm
    max_history_messages: 6
    history_message_max_chars: 800 # assistant 한도; user 발화는 슈퍼바이저에서 2배(최대 3200자)까지
    branches:
      - name: trading_agent
        function_name: trading_branch_agent
        description: "Kis Trading MCP(조회 전용): 계좌·잔고·보유·체결, 현재가·호가·시가총액·거래량·순위 등 정형 시장/계좌 데이터 조회. 주문 요청은 주문을 내지 않고 텔레그램 /buy·/sell·/advise 명령으로 안내."
      - name: monitoring_agent
        function_name: monitoring_branch_agent
        description: "보유·관심 포트폴리오 상태 점검, 리스크/하락/알림/건전성 모니터링."
      - name: news_agent
        function_name: news_branch_agent
        description: "종목·시황 뉴스 헤드라인·요약, 실적·earnings·분기보고서·사업보고서 분석. 투자자 수급은 Kis Trading MCP 경로로 조회."
      - name: recommend_agent
        function_name: recommend_branch_agent
        description: "조건에 맞는 종목 후보 탐색, 대안 종목, 관심종목 아이디어 추천."
      - name: strategy_agent
        function_name: strategy_branch_agent
        description: "BUY/SELL/HOLD 판단, 매매 규칙, 시나리오, 비중·리밸런싱 전략."
      - name: diary_agent
        function_name: diary_branch_agent
        description: "당일 거래 조회, 매매일지 초안, 거래 회고와 기록 정리."

  transcript_router_agent:
    _type: finus_sqlite_transcript_agent
    inner_agent_name: router_supervisor_agent
    db_path: ${FINUS_TRANSCRIPT_DB_PATH:-.state/conversations.sqlite3}
    max_history_messages: 30

# 추론 각주(#260)는 최상위 finus_reasoning_trace_agent가 붙입니다(#273).
# vendor auto_memory_agent는 쓰지 않습니다(#397): 사용자 발화와 답변 전문(잔고·금액 포함)을
# 매 턴 메모리에 저장하기 때문입니다. 체인은 router_nomemory.yml과 같습니다.
workflow:
  _type: finus_reasoning_trace_agent
  inner_agent_name: transcript_router_agent
