base: agents/diary_agent.yml
# src/nat_finus_nat/supervisor.py 의 router_supervisor_agent 설정을 확장합니다(common.yml 상속).
# Mem0(self-hosted) + auto_memory_agent 조합. 실행: ./scripts/run.sh --memory 또는 FINUS_NAT_CONFIG_FILE 로 이 파일 지정.
# 기본 ./scripts/run.sh 는 router_nomemory.yml 입니다(Mem0 없음).
llms:
  router_openai_llm:
    _type: openai
    api_key: ${OPENAI_API_KEY}
    base_url: ${OPENAI_API_BASE_URL:-${OPENAI_BASE_URL:-https://api.openai.com/v1}}
    model_name: ${ROUTER_OPENAI_CHAT_MODEL:-gpt-5.4-mini}

memory: # 라우터 에이전트의 Mem0 메모리 설정
  router_mem0_memory:
    _type: mem0_memory
    host: ${FINUS_MEM0_HOST:-http://localhost:8888}
    org_id: ${FINUS_MEM0_ORG_ID:-selfhost-org}
    project_id: ${FINUS_ROUTER_MEM0_PROJECT_ID:-selfhost-router-project}

functions:
  add_user_memory:
    _type: add_memory
    memory: router_mem0_memory
    description: |
      Store durable user traits, preferences, personality, or response style only.
      Do not store one-off questions, transient market data, or full answers.

  get_user_memory:
    _type: get_memory
    memory: router_mem0_memory
    description: |
      Retrieve durable user traits, preferences, personality, or response style before personalized answers.

  router_supervisor_agent:
    _type: finus_supervisor_agent
    llm_name: router_openai_llm
    max_history_messages: 6
    history_message_max_chars: 800 # assistant 한도; user 발화는 슈퍼바이저에서 2배(최대 3200자)까지
    branches:
      - name: trading_agent
        function_name: trading_branch_agent
        description: "Kis Trading MCP: 계좌·잔고·보유·주문·체결, 현재가·호가·시가총액·거래량·순위 등 정형 시장/계좌 데이터 조회."
      - name: monitoring_agent
        function_name: monitoring_branch_agent
        description: "보유·관심 포트폴리오 상태 점검, 리스크/하락/알림/건전성 모니터링."
      - name: news_agent
        function_name: news_branch_agent
        description: "종목·시황 뉴스 헤드라인·요약, 실적·earnings·분기보고서·사업보고서 분석. 투자자 수급은 Kis Trading MCP 경로로 조회."
      - name: recommend_agent
        function_name: recommend_branch_agent
        description: "조건에 맞는 종목 후보 탐색, 대안 종목, 관심종목 아이디어 추천."
      - name: strategy_agent
        function_name: strategy_branch_agent
        description: "BUY/SELL/HOLD 판단, 매매 규칙, 시나리오, 비중·리밸런싱 전략."
      - name: diary_agent
        function_name: diary_branch_agent
        description: "당일 거래 조회, 매매일지 초안, 거래 회고와 기록 정리."

  transcript_router_agent:
    _type: finus_sqlite_transcript_agent
    inner_agent_name: router_supervisor_agent
    db_path: ${FINUS_TRANSCRIPT_DB_PATH:-.state/conversations.sqlite3}
    max_history_messages: 30

  memory_router_agent: # Mem0 auto_memory_agent를 설정합니다.
    _type: auto_memory_agent
    inner_agent_name: transcript_router_agent
    memory_name: router_mem0_memory
    llm_name: router_openai_llm
    add_params:
      infer: false
    verbose: true
    description: "Fin-Us router supervisor with separate Mem0 memory"

# 추론 각주(#260)는 최상위 finus_reasoning_trace_agent가 붙입니다 — vendor
# auto_memory_agent 바깥입니다(#273). vendor _response_fn 시그니처가
# (input_message: str) -> str 이라, 안쪽에서 ChatResponse에 붙인
# routed_agent/tools_used는 이 래퍼를 통과하면서 버려집니다. 부착 지점을 그 위로
# 올렸으므로 router_nomemory.yml과 같은 자리에서 각주가 실립니다.
workflow:
  _type: finus_reasoning_trace_agent
  inner_agent_name: memory_router_agent
